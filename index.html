if(ci>=0)custom.splice(ci,1);else if(hidden.indexOf(n)<0)hidden.push(n);
saveNames();
if(selName===n)setSel('');else renderPick();
toast(TX('removed')+dispName(n));
}
function handlePick(t){
const d=t.dataset||{};
if(d.i!==undefined){
const q=allQuick()[Number(d.i)];
if(q){setSel(q[0]);$('un').value=q[1];$('pickList').hidden=true;}
}else if(d.del!==undefined){
const q=allQuick()[Number(d.del)];
if(q)removeName(q[0]);
}
}
$('pickList').addEventListener('click',e=>{e.stopPropagation();handlePick(e.target);});
document.addEventListener('click',e=>{const w=$('pickWrap');if(w&&!w.contains(e.target))$('pickList').hidden=true;});
function rememberName(n,u){
if(allQuick().some(q=>q[0]===n))return;
if(QK().some(q=>q[0]===n)&&hidden.indexOf(n)>=0)hidden=hidden.filter(x=>x!==n);
else custom.push([n,u]);
saveNames();
}
let toastT;
function toast(m){const t=$('toast');t.textContent=m;t.className='on';clearTimeout(toastT);toastT=setTimeout(()=>{t.className='';},2200);}
function add(){
const n=$('nm').value.trim();
if(!n){$('nm').focus();return;}
const had=allQuick().some(q=>q[0]===n);
rememberName(n,$('un').value);
setSel('');
$('nm').value='';
toast((had?TX('exists'):TX('added'))+n);
}
$('nm').addEventListener('keydown',e=>{if(e.key==='Enter')add();});
function selAll(el){try{el.select();el.setSelectionRange(0,String(el.value).length);}catch(e){}}
$('qt').addEventListener('focus',e=>{const el=e.target;setTimeout(()=>selAll(el),30);});
$('qt').addEventListener('click',e=>selAll(e.target));
$('list').addEventListener('focusin',e=>{const el=e.target;if(el.dataset&&el.dataset.a==='q')setTimeout(()=>selAll(el),30);});
function addSelected(){
if(!selName){toast(TX('pick_first'));return;}
const qk=allQuick().find(q=>q[0]===selName);
if(!qk){setSel('');return;}
addItem(qk[0],$('un').value,$('qt').value.trim()||'1');
setSel('');$('qt').value='1';
}

function render(){
const all=items.filter(x=>!x.d).concat(items.filter(x=>x.d));
$('list').innerHTML=all.length?all.map(x=>`<div class="item${x.d?' done':''}" data-id="${x.id}"><input type="checkbox" data-a="chk"${x.d?' checked':''}><span class="nm">${esc(dispName(x.n))}</span><input class="q" type="text" inputmode="decimal" data-a="q" value="${esc(x.q)}"><span class="u">${esc(dispUnit(x.u))}</span><button class="x" data-a="del" aria-label="${esc(TX('del'))}">\u00d7</button></div>`).join(''):'<div class="empty">'+TX('empty')+'</div>';
const n=items.filter(x=>!x.d).length;
$('left').textContent=n?(TX('left')+n):'';
document.querySelectorAll('#tabs button').forEach(b=>{const c=b.dataset.c,k=(c===cat?items:D[c].items).filter(x=>!x.d).length;b.querySelector('.cn').textContent=k||'';});
}
function find(el){const r=el.closest('.item');return r?items.find(x=>x.id===r.dataset.id):null;}
$('list').addEventListener('click',e=>{
const a=e.target.dataset.a;
if(a==='chk'){const it=find(e.target);if(it){it.d=e.target.checked;save();render();}}
else if(a==='del'){const it=find(e.target);if(it){items=items.filter(x=>x!==it);save();render();}}
else if(a==='q'){selAll(e.target);}
});
$('list').addEventListener('change',e=>{
if(e.target.dataset.a!=='q')return;
const it=find(e.target);if(!it)return;
it.q=e.target.value.trim()||'1';save();render();
});

function slipGroups(){
const out=[];
['r','m','g','v'].forEach(c=>{
const arr=(c===cat?items:D[c].items).filter(x=>!x.d);
if(arr.length)out.push({c:c,pend:arr});
});
return out;
}
function textList(){
const gs=slipGroups();
if(!gs.length)return '';
return TX('slip_title')+'\n\n'+gs.map(gp=>TX('cat_'+gp.c)+'\n'+gp.pend.map(x=>'\u2022 '+dispName(x.n,gp.c)+' \u2014 '+x.q+' '+dispUnit(x.u)).join('\n')).join('\n\n');
}
function copyText(t){
const fb=()=>{const ta=document.createElement('textarea');ta.value=t;document.body.appendChild(ta);ta.select();try{document.execCommand('copy');toast(TX('copied'));}catch(e){toast(TX('copy_fail'));}ta.remove();};
if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(t).then(()=>toast(TX('copied')),fb);}else fb();
}
function shareList(){
const t=textList();
if(!t){toast(TX('nothing_left'));return;}
if(navigator.share){navigator.share({text:t}).catch(()=>{});return;}
try{window.open('https://wa.me/?text='+encodeURIComponent(t),'_blank');}catch(e){copyText(t);}
}
let slipData=null;
function openSlip(){
const gs=slipGroups();
const total=gs.reduce((a,gp)=>a+gp.pend.length,0);
if(!total){toast(TX('nothing_left'));$('slip').hidden=true;return;}
const d=new Date(),dt=String(d.getDate()).padStart(2,'0')+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+d.getFullYear();
let html='',no=0;
gs.forEach(gp=>{
const cols=gp.pend.length>18?2:1,per=Math.ceil(gp.pend.length/cols);let ch='';
for(let c=0;c<cols;c++){ch+='<div class="col">'+gp.pend.slice(c*per,(c+1)*per).map((x,j)=>'<span class="no">'+(no+c*per+j+1)+'</span><span class="bxc"><i class="box"></i></span><span class="t">'+esc(dispName(x.n,gp.c))+'</span><span class="qty">'+esc(x.q)+' '+esc(dispUnit(x.u))+'</span>').join('')+'</div>';}
no+=gp.pend.length;
html+='<div class="gh"><span>'+esc(TX('cat_'+gp.c))+'</span><b>'+gp.pend.length+'</b></div><div class="rows">'+ch+'</div>';
});
$('paper').innerHTML='<div class="ph"><h2>'+TX('slip_title')+'</h2><div class="dt">'+dt+'</div></div>'+html+'<div class="ct">'+TX('total')+total+'</div>';
slipData={gs:gs,total:total,dt:dt,fd:d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')};
$('slip').hidden=false;$('slip').scrollTop=0;
}
function closeSlip(){$('slip').hidden=true;}
function dl(name,blob){
if(window.Android&&typeof window.Android.saveFile==='function'){const r=new FileReader();r.onload=()=>{try{window.Android.saveFile(name,blob.type||'application/octet-stream',String(r.result).split(',')[1]);toast(TX('img_saved'));}catch(e){toast(TX('save_fail')+e);}};r.readAsDataURL(blob);return;}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),1500);
}
function saveSlip(){
if(!slipData)return;
const rtl=RTL(),sg=rtl?-1:1,ACC='#1f6b4a';
const gs=slipData.gs,S=2,W=520,pad=16,gap=14,rowH=30,top=68,gh=26,ggap=8;
const F=FONT();
try{
const mc=document.createElement('canvas').getContext('2d');
mc.direction=rtl?'rtl':'ltr';
let y0=top;
const G=gs.map(gp=>{
const n=gp.pend.length,cols=n>18?2:1,per=Math.ceil(n/cols),colW=(W-2*pad-(cols-1)*gap)/cols;
const lay=[];
for(let col=0;col<cols;col++){
const part=gp.pend.slice(col*per,(col+1)*per);
mc.font='500 14px '+F;
const qs=part.map(x=>x.q+' '+dispUnit(x.u)),qmax=Math.max.apply(null,qs.map(q=>mc.measureText(q).width));
const avail=colW-48-qmax-24-12;
mc.font='400 17px '+F;
const ns=part.map(x=>{const full=dispName(x.n,gp.c);let nn=full;while(nn.length>1&&mc.measureText(nn).width>avail)nn=nn.slice(0,-1);return nn!==full?nn+'\u2026':nn;});
const nmax=Math.max.apply(null,ns.map(nn=>mc.measureText(nn).width));
lay.push({qs:qs,ns:ns,nmax:nmax});
}
const o={gp:gp,cols:cols,per:per,colW:colW,lay:lay,y:y0};
y0+=gh+4+per*rowH+ggap;
return o;
});
const H=y0+40;
const c=document.createElement('canvas');c.width=W*S;c.height=H*S;
const g=c.getContext('2d');g.scale(S,S);
g.fillStyle='#fff';g.fillRect(0,0,W,H);
g.fillStyle=ACC;g.fillRect(0,0,W,8);
g.strokeStyle='#dfe3e1';g.lineWidth=1;g.strokeRect(0.5,0.5,W-1,H-1);
g.textBaseline='middle';
g.direction=rtl?'rtl':'ltr';
g.textAlign=rtl?'right':'left';g.fillStyle='#1b1b1b';g.font='600 20px '+F;g.fillText(TX('slip_title'),rtl?W-pad:pad,34);
g.direction='ltr';g.textAlign=rtl?'left':'right';g.fillStyle='#777';g.font='13px '+F;g.fillText(slipData.dt,rtl?pad:W-pad,34);
g.direction=rtl?'rtl':'ltr';
g.fillStyle=ACC;g.fillRect(pad,56,W-2*pad,1.5);
let no=0;
G.forEach(o=>{
const hy=o.y,base=hy+gh+4;
g.fillStyle='#e7f4ed';g.fillRect(pad,hy,W-2*pad,gh);
g.fillStyle=ACC;g.textAlign=rtl?'right':'left';g.font='600 14px '+F;g.fillText(TX('cat_'+o.gp.c),rtl?W-pad-8:pad+8,hy+gh/2);
g.textAlign=rtl?'left':'right';g.font='600 13px '+F;g.fillText(String(o.gp.pend.length),rtl?pad+8:W-pad-8,hy+gh/2);
o.gp.pend.forEach((x,i)=>{
const col=Math.floor(i/o.per),row=i%o.per,L=o.lay[col];
const O=rtl?W-pad-col*(o.colW+gap):pad+col*(o.colW+gap);
const x0=rtl?O-o.colW:O,ry=base+row*rowH,y=ry+rowH/2,nx=O+sg*48;
if(row%2===1){g.fillStyle='#f5f7f6';g.fillRect(x0,ry,o.colW,rowH);}
g.fillStyle='#eceeed';g.fillRect(x0,ry+rowH-1,o.colW,1);
g.textAlign=rtl?'right':'left';
g.fillStyle='#9aa19d';g.font='11px '+F;g.fillText(String(no+i+1),O+sg*6,y);
g.fillStyle='#fff';g.fillRect(rtl?O-42:O+30,y-6,12,12);
g.strokeStyle='#555';g.lineWidth=1;g.strokeRect(rtl?O-42:O+30,y-6,12,12);
g.font='400 17px '+F;g.fillStyle='#1b1b1b';g.fillText(L.ns[row],nx,y);
g.font='500 14px '+F;g.fillStyle=ACC;g.fillText(L.qs[row],nx+sg*(L.nmax+24),y);
});
no+=o.gp.pend.length;
});
g.fillStyle='#eceeed';g.fillRect(pad,H-36,W-2*pad,1.5);
g.textAlign='center';g.fillStyle='#1b1b1b';g.font='600 13px '+F;g.fillText(TX('total')+slipData.total,W/2,H-17);
const filename='parchi_'+slipData.fd+'.png';
if(typeof c.toBlob==='function'){c.toBlob(b=>{if(!b){toast(TX('img_fail'));return;}dl(filename,b);},'image/png');}
else{const data=c.toDataURL('image/png');const raw=atob(data.split(',')[1]);const arr=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)arr[i]=raw.charCodeAt(i);dl(filename,new Blob([arr],{type:'image/png'}));}
}catch(e){toast(TX('img_fail'));}
}
let askFn=null;
function ask(m,fn){$('askMsg').textContent=m;askFn=fn;$('ask').hidden=false;}
function askNo(){$('ask').hidden=true;askFn=null;}
function askYes(){const f=askFn;askNo();if(f)f();}
function clearBought(){
if(!items.some(x=>x.d)){toast(TX('none_marked'));return;}
ask(TX('ask_bought'),()=>{items=items.filter(x=>!x.d);save();render();});
}
function clearAll(){
if(!items.length)return;
ask(TX('ask_all'),()=>{items=[];save();render();});
}
let touched=false;
['pointerdown','keydown'].forEach(ev=>document.addEventListener(ev,()=>{touched=true;},{once:true,passive:true}));
const UP=(function(){try{return window.parent&&window.parent!==window&&window.parent.AppUpd?window.parent.AppUpd:null;}catch(e){return null;}})();
function checkUpdate(manual){
if(!UP)return;
UP.check(function(st){
if(st==='ready'){if(manual||!touched){UP.apply();}else{$('updBar').hidden=false;}}
else if(manual){toast(TX(st==='none'?'upd_none':st==='off'?'upd_off':'upd_fail'));}
});
}
window.addEventListener('online',()=>checkUpdate(false));
applyLang();
window.__bootOk=true;
setTimeout(()=>checkUpdate(false),1500);
<\/script>
